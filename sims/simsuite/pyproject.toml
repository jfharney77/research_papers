[project]
name = "simsuite"
version = "0.1.0"
description = "Multi-agent simulation research suite: CalibSoc calibration harness + DivProbe diversity diagnostics (Projects 1 and 4 of docs/specs/simsuite_implementation_specs.md)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
