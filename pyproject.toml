[project]
name = "research-papers"
version = "0.1.0"
description = "Research Paper Workspace — convert Word manuscripts into per-section LaTeX, build conference PDFs, and review them in a web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-docx>=1.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Claude provider for the Critic feature. Ollama/Cerebras providers use httpx.
llm = ["anthropic>=0.40"]

[project.scripts]
papers = "docbuilder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
